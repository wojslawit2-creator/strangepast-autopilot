name: Strange Past autopilot

on:
  schedule:
    - cron: "17 17 * * *"   # ~12:17 New York / 18:17 Warsaw
    - cron: "43 23 * * *"   # ~18:43 New York / 00:43 Warsaw
    - cron: "11 3 * * 1"    # Mondays: refresh Instagram token
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only make the video, do not publish"
        type: boolean
        default: true

permissions:
  contents: write
  issues: write

concurrency: autopilot

jobs:
  post:
    if: github.event.schedule != '11 3 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg, fonts, packages
        run: |
          curl -sSL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
          mkdir -p assets/fonts
          curl -sSL -o assets/fonts/Anton-Regular.ttf https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf
          pip install -q -r requirements.txt
      - name: Make and publish reel
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE }}
        run: python main.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reel
          path: out/
          retention-days: 14
      - name: Save topic history
        if: always()
        run: |
          git config user.name strangepast-bot
          git config user.email bot@users.noreply.github.com
          git add data/ && git commit -qm "log $(date -u +%F_%H%M)" && git push -q || echo "nothing to commit"
      - name: Remind to publish TikTok draft
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f out/tiktok_inbox ]; then
            gh issue create --title "TikTok draft ready: $(cat out/tiktok_inbox)" --body-file out/caption.txt
          fi

  refresh:
    if: github.event.schedule == '11 3 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python main.py refresh-ig
